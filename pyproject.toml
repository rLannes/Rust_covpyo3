[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "Rust_covpyo3"
dynamic = ["version"]
readme = "readme.rmd"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",      
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

description = "Fast Rust-backed per-base coverage computation over genomic regions from BAM files."
requires-python = ">=3.9"
license = { text = "MIT" }           
authors = [
    { name = "Romain Lannes", email = "romain.lannes@protonmail.com" },
]
keywords = ["bioinformatics", "bam", "coverage", "genomics", "rust", "pyo3"]

dependencies = [
    "numpy",
]

[project.urls]
Homepage = "https://github.com/rLannes/Rust_covpyo3"       
Repository = "https://github.com/rLannes/Rust_covpyo3"
Issues = "https://github.com/rLannes/Rust_covpyo3/issues"

[tool.maturin]
features = ["pyo3/extension-module"]

# Settings used by `maturin generate-ci github` to write .github/workflows/CI.yml
[tool.maturin.generate-ci.github]
trusted-publishing = true
publishing-environment = "pypi"
pytest = false                      # set to true once a tests/ suite exists

[[tool.maturin.generate-ci.github.linux.target]]
arch = "x86_64"
runner = "ubuntu-22.04"
manylinux = "2014"
before-script-linux = "yum install -y perl-IPC-Cmd perl-Time-Piece"

[[tool.maturin.generate-ci.github.linux.target]]
arch = "aarch64"
runner = "ubuntu-24.04-arm"         # native ARM runner, no cross-compilation of htslib
manylinux = "2014"
before-script-linux = "yum install -y perl-IPC-Cmd perl-Time-Piece"

[tool.maturin.generate-ci.github.macos]
targets = ["x86_64", "aarch64"]

